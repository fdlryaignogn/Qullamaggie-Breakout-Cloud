name: Review Stage 2 Setup
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock symbol shown in Stage 2 (e.g. AMPL)"
        required: true
        type: string
      setup_id:
        description: "Exact Setup ID from Stage 2"
        required: true
        type: string
      decision:
        description: "Manual decision (READY requires confirmed chart review)"
        required: true
        type: choice
        options:
          - READY
          - FORMING
          - INVALIDATED
      confirmed_chart_review:
        description: "Have you reviewed base, contraction, pivot and risk?"
        required: true
        type: boolean
        default: false
      review_reason:
        description: "Public review note. Do not include private trading/account information."
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: qullamaggie-eod-scan
  cancel-in-progress: false
jobs:
  record-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the review and publish without marking a new scan
        env:
          REVIEW_SYMBOL: ${{ inputs.symbol }}
          REVIEW_SETUP_ID: ${{ inputs.setup_id }}
          REVIEW_DECISION: ${{ inputs.decision }}
          REVIEW_CONFIRM: ${{ inputs.confirmed_chart_review }}
          REVIEW_REASON: ${{ inputs.review_reason }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          command=[sys.executable, "review_setup.py",
                   "--symbol", os.environ["REVIEW_SYMBOL"],
                   "--setup-id", os.environ["REVIEW_SETUP_ID"],
                   "--decision", os.environ["REVIEW_DECISION"],
                   "--note", os.environ["REVIEW_REASON"]]
          if os.environ["REVIEW_CONFIRM"] == "true":
              command.append("--confirm-reviewed")
          subprocess.run(command, check=True)
          PY
      - name: Persist audited decision and update public watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking_state.json site/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage 2 authenticated review: ${{ github.run_id }}"
            git push
          fi
