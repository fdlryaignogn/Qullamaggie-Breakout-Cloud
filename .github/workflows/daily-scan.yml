name: Qullamaggie US EOD Cloud Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'
      timezone: America/New_York
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qullamaggie-eod-scan
  cancel-in-progress: false
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Scan NYSE universe and publish only a complete fresh result
        run: python cloud_scan.py
      - name: Persist latest successful scan and watch history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/ data/tracking_state.json data/scan_metadata.json data/listing_cache/
          if ! git diff --cached --quiet; then
            git commit -m "EOD scan: $(date -u +%F)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4