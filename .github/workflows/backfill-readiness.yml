name: Backfill Stage 2 V3.1 Scores
on:
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'backfill_readiness.py'
permissions:
  contents: write
concurrency:
  group: qullamaggie-eod-scan
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Evaluate existing Stage 2 setups without fetching market data
        run: python backfill_readiness.py
      - name: Commit readiness only; preserve last successful scan timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking_state.json site/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "V3.1 score backfill for verified previous market session"
            git push
          fi
