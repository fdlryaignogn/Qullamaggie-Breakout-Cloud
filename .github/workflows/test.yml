name: Verify cloud scanner
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scanner dependencies and test runner
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run tests without publishing market data
        run: python -m pytest -q tests
