name: Verify cloud scanner
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'site/**'
      - 'review-auth/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scanner dependencies and test runner
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run tests without publishing market data
        run: python -m pytest -q tests
      - name: Audit published Stage 3 EOD snapshot without modifying it
        run: python stage3_eod_audit.py --strict
      - name: Test GitHub App reviewer security gateway
        run: node --test review-auth/tests/*.test.mjs
      - name: Check cloud dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('site/index.html').read_text(encoding='utf-8')
          js = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.DOTALL)
          assert len(js) == 1, "Expected exactly one embedded dashboard script"
          Path('/tmp/qullamaggie-dashboard.js').write_text(js[0], encoding='utf-8')
          assert 'CLOUD_REFRESH_INTERVAL_MS=30*60*1000' in js[0]
          assert 'CLOUD_LAST_SEEN_SCAN_KEY' in js[0]
          assert 'cloudUpdateBanner' in html
          PY
          node --check /tmp/qullamaggie-dashboard.js
