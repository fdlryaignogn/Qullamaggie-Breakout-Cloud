<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qullamaggie Breakout Cloud</title><style>body{font:15px system-ui,sans-serif;background:#101826;color:#f3f7ff;margin:0}header{position:sticky;top:0;background:#15243a;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}main{max-width:1200px;margin:auto;padding:24px}button,select{background:#25466a;color:white;border:1px solid #53759c;border-radius:7px;padding:9px;cursor:pointer}nav{display:flex;gap:8px;margin:18px 0}table{width:100%;border-collapse:collapse;background:#172438}th,td{border-bottom:1px solid #344357;padding:12px;text-align:left}small{color:#b9c7d8}.notice{background:#332c1e;padding:14px;border-radius:8px;margin-bottom:18px}</style></head><body><header><strong>Qullamaggie Breakout Cloud · v3 (setup)</strong><span><select id="lang"><option value="zh">繁體中文</option><option value="en">English</option></select> <button onclick="refresh()">↻</button></span></header><main><h1 id="heading">三階段股票監察</h1><p id="meta"></p><div id="notice" class="notice">尚未完成第一次雲端掃描，沒有可顯示的選股結果。</div><nav><button onclick="show('1')">1 · Momentum</button><button onclick="show('2')">2 · Setup</button><button onclick="show('3')">3 · Breakout</button></nav><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><p><small id="foot"></small></p></main><script>let data=null,stage='1';const $=x=>document.getElementById(x);const tr=(zh,en)=>$('lang').value==='zh'?zh:en;function show(s){stage=s;render()}function render(){let m=data?.metadata||{},rows=data?.state?.[stage]||[];let fields=stage==='1'?['symbol','return_1m','rank_pct_1m','return_3m','rank_pct_3m','return_6m','rank_pct_6m']:stage==='2'?['symbol','setup_status','prior_advance_pct','base_start','base_high','ready_since']:['symbol','status','breakout_level','triggered_at'];$('heading').textContent=tr('三階段股票監察','Three-stage stock monitor');$('meta').textContent=tr('行情日期','Market session')+': '+(m.as_of_date||'—')+' | '+tr('最後成功掃描','Last successful scan')+': '+(m.last_success||'—')+' | '+tr('股票池','Universe')+': '+(m.universe_size??'—');$('notice').style.display=m.phase==='success'?'none':'block';$('notice').textContent=tr('尚未取得已驗證的全市場掃描結果。','No verified full-market scan has been published yet.');$('thead').innerHTML='<tr>'+fields.map(x=>'<th>'+x+'</th>').join('')+'</tr>';$('tbody').innerHTML=rows.map(r=>'<tr>'+fields.map(f=>'<td>'+String(r[f]??'—').replaceAll('&','&amp;').replaceAll('<','&lt;')+'</td>').join('')+'</tr>').join('');$('foot').textContent=tr('只讀介面；READY 及 TRIGGERED 需要人工覆核。','Read-only; READY and TRIGGERED require human review.')};async function refresh(){try{let r=await fetch('./data/latest.json?bust='+Date.now());if(!r.ok)throw Error(r.status);data=await r.json();render()}catch(e){$('notice').textContent='Data load failed: '+e}}$('lang').onchange=render;refresh()</script></body></html>
